name: Seite veröffentlichen
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 1 * *"   # monatlich frische Diyanet-Zeiten
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diyanet-Zeiten erneuern (nur monatlich; bei Fehler bleiben die gespeicherten)
        if: github.event_name != 'push'
        timeout-minutes: 8
        continue-on-error: true
        run: python3 diyanet.py || git checkout -- web/zeiten
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
