// Kunst je Gebet: monochrome Himmelsszene, Kugel = Stand der Sonne, nachts Mondsichel
function kunst(i){const g='g'+i,k='k'+i;const S={0:['#2c2c30','#c4c4c8',[100,236,15],'#f2f2f3',.55],2:['#f7f7f8','#bcbcc0',[104,74,22],'#ffffff',.18],3:['#e3e3e5','#98989d',[146,126,20],'#fbfbfb',.22],4:['#8b8b90','#2a2a2d',[66,206,24],'#e9e9eb',.4],5:['#1c1c1f','#040405',null,'#e9e9eb',.6]}[i];

 el.style.color=hell(g)?'#1d1d1f':'#f5f5f7';if(hell(g))el.classList.add('hellk');el.querySelector('.name').textContent=NAMEN[g];
 const tl=document.createElement('div');tl.className='kteile';const teile=TEILE[g];if(gewaehlt[g]===undefined)gewaehlt[g]=Math.max(0,teile.findIndex(t=>t[1].includes('Farz')));

  b.onclick=e=>{e.stopPropagation();if(karten[zeige]?.el!==el){gehe(j);return}gewaehlt[g]=x;haptik();tl.querySelectorAll('button').forEach((c,y)=>c.setAttribute('aria-pressed',y===x))};tl.append(b)});

 if(VAR==='faecher'){if(d<=0)return{x:-a*w*.95-a*a*3,y:a*12+a*a*4,z:-a*40,ry:a*12,rz:-a*11,o:a>3.2?Math.max(0,3.8-a)/.6:1};return{x:d*w*.9,y:-d*3,z:-d*150,ry:-Math.min(55,d*28),rz:d*3,o:d>3.4?Math.max(0,4-d)/.6:1}}

 if(!zieht){const f=(ziel-pos)*170-vel*24;vel+=f*dt;pos+=vel*dt;if(Math.abs(ziel-pos)<.0004&&Math.abs(vel)<.002){pos=ziel;vel=0}}
 // klebendes Nachziehen: je weiter eine Karte vom Ziel weg ist, desto weicher ihre Feder
 for(const k of karten){const ab=Math.abs(k.j-ziel),K=420/(1+ab*.9),D=2*Math.sqrt(K)*.72;const f=(pos-k.p)*K-k.v*D;k.v+=f*dt;k.p+=k.v*dt}
 const stufe=Math.max(0,Math.min(karten.length-1,Math.round(pos)));if(stufe!==letzteStufe){if(letzteStufe!==null){haptik();zeige=stufe;info()}letzteStufe=stufe}

 const pl=$('play');pl.style.opacity=pl.dataset.weg?0:1-f;pl.style.transform='translateX('+(-rest*W()*.6).toFixed(1)+'px) scale('+(1-f*.35).toFixed(3)+')';pl.style.pointerEvents=pl.dataset.weg||f>.3?'none':'';

B.addEventListener('pointermove',e=>{if(!zug)return;const dx=achse(e)-(senk?zug.y:zug.x);if(!zug.los&&Math.abs(dx)>7&&Math.abs(dx)>Math.abs(quer(e)-(senk?zug.x:zug.y))){zug.los=true;zieht=true;B.setPointerCapture(e.pointerId)}if(!zug.los)return;

 else{const el=e.target.closest('button')?null:e.target.closest('.karte');if(el){const k=karten.find(k=>k.el===el);if(k.j!==ziel)gehe(k.j);else{k.el.animate([{filter:'brightness(1)'},{filter:'brightness(1.15)'},{filter:'brightness(1)'}],{duration:350});haptik()}}}zug=null});

  teile.forEach(([id,n],x)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{haptik();setze(x)};seg.append(b)});a.append(seg);requestAnimationFrame(()=>setze(gewaehlt[g]))}
 else{const z=document.createElement('div');z.className='zwei';const ok=document.createElement('button');ok.className='los press';ok.innerHTML=icon('check')+'<span>'+(heute.ok[g]?'Gebetet':'Gebetet?')+'</span>';
  ok.onclick=()=>{heute.ok[g]=!heute.ok[g];heuteSpeichern();if(heute.ok[g]){const [x,y]=mitte(ok);wirkung(x,y,.12)}else haptik();altSchluessel='';info()};const kz=document.createElement('button');kz.className='los press';kz.innerHTML='<span>Verpasst · zu Kaza</span>';

 $('iSub').textContent=s==='jetzt'?'noch '+dauer(l.ende-l.m)+(l.ende-l.m>=60?' Std.':'')+' · bis '+hm(l.ende):s==='zu'?'ab '+hm(TAG.T[g])+' · in '+dauer(TAG.T[g]-l.m)+(TAG.T[g]-l.m>=60?' Std.':''):hm(TAG.T[g])+' – '+hm(ende)}

 z.firstChild.innerHTML=name+'<small>'+[2,4,4,3,4,3][j]+' REKAT</small>';const n=z.querySelector('b'),hak=z.querySelector('.hak');rollen(n,zahl(zustand.kaza.open[k]||0));

 el.innerHTML='<span>'+n+'<em>'+b+'</em></span><b>'+icon('play')+'</b>';el.onclick=()=>{tonWahl=id;try{localStorage.setItem('sajda-ton',id)}catch{}haptik();spielen(id);toeneZeichnen()};return el}));
 const sicher=window.isSecureContext&&'Notification'in window;$('tonTest').textContent='Test-Erinnerung in 10 Sekunden';

// ---------- echter Push (nur über den Test-Server mit HTTPS-Tunnel) ----------
const b64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');const r=atob(s+'='.repeat((4-s.length%4)%4));return Uint8Array.from(r,c=>c.charCodeAt(0))};
const pushStatus=t=>$('pushStatus').textContent=t;
async function pushAn(){haptik();if(!window.isSecureContext)return pushStatus('Nur über die HTTPS-Adresse möglich.');
 if(!('serviceWorker'in navigator)||!('PushManager'in window))return pushStatus('Auf dem iPhone: Teilen → „Zum Home-Bildschirm“, dann Falak vom Homescreen öffnen und hier erneut tippen.');
 try{const reg=await navigator.serviceWorker.register('sw-push.js');await navigator.serviceWorker.ready;
  if(await Notification.requestPermission()!=='granted')return pushStatus('Mitteilungen wurden nicht erlaubt.');
  const {schluessel}=await (await fetch('/api/push/schluessel')).json();
  const abo=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(schluessel)});
  const r=await (await fetch('/api/push/abo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(abo)})).json();
  pushStatus(r.ok?'Push ist an. Jetzt „Push in 30 s“ tippen und die App schließen.':'Fehler: '+r.fehler)}catch(e){pushStatus('Fehler: '+e.message)}}
async function pushPost(pfad,daten,ok){haptik();try{const r=await (await fetch(pfad,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(daten)})).json();pushStatus(r.ok?ok(r):'Fehler: '+r.fehler)}catch(e){pushStatus('Server nicht erreichbar.')}}
$('pushAn').onclick=pushAn;
$('pushTest').onclick=()=>{const l=lage(),g=l.gebet??GEBETE[ziel];pushPost('/api/push/test',{sekunden:30,text:'Zeit für das '+NAMEN[g]+' · '+hm(TAG.T[g])},()=>'Kommt in 30 Sekunden. App jetzt schließen.')};
$('pushHeute').onclick=()=>pushPost('/api/push/heute',{},r=>r.geplant?r.geplant+' Erinnerungen für heute geplant (Stuttgart).':'Heute stehen keine Gebetszeiten mehr an.');

// ---------- Zeitbogen: heutige Zeiten auf einer Bahn, der Jetzt-Punkt schrumpft, je näher die nächste Zeit rückt ----------
const ZB={a:[14,62],c:[170,4],e:[326,62]};
const zbPunkt=t=>{const u=1-t;return[u*u*ZB.a[0]+2*u*t*ZB.c[0]+t*t*ZB.e[0],u*u*ZB.a[1]+2*u*t*ZB.c[1]+t*t*ZB.e[1]]};
function zbT(m){const T=TAG.T,von=T[0]-20,bis=T[5]+40;return Math.max(0,Math.min(1,(m-von)/(bis-von)))}
// Anteil des aktuellen Gebetsfensters, der noch übrig ist (1 = gerade angefangen, 0 = gleich vorbei)
function seitBeginn(l=lage()){if(l.gebet===null)return Infinity;const T=TAG.T;return l.m-(l.gebet===5&&l.m<T[0]?T[5]-1440:T[l.gebet])}
function frische(l=lage()){if(l.gebet===null)return 0;const T=TAG.T,von=l.gebet===5&&l.m<T[0]?T[5]-1440:T[l.gebet];return Math.max(0,Math.min(1,(l.ende-l.m)/(l.ende-von)))}
function zeitbogen(l){const T=TAG.T,svg=$('zbSvg'),pfad=n=>{let d='';for(let i=0;i<=n;i++){const p=zbPunkt(i/n*1);d+=(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}return d};
 const tj=l.m<T[0]?0:zbT(l.m),voll=[];for(let i=0;i<=40;i++){const t=i/40*tj,p=zbPunkt(t);voll.push((i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1))}
 const rueck=l.fenster===5&&l.m>=T[5],naechst=l.naechst,marken=T.map((t,i)=>{const p=zbPunkt(zbT(t)),vorbei=t<=l.m&&l.m>=T[0],an=i===l.fenster;
  return'<circle class="zb-punkt'+(vorbei?' vorbei':'')+(i===naechst&&!rueck?' naechst':'')+(heute.ok[i]&&i!==1?' gebetet':'')+'" cx="'+p[0]+'" cy="'+p[1]+'" r="'+(i===naechst?3.2:2.2)+'"/>'+
   '<text class="zb-name'+(an?' an':'')+'" x="'+p[0]+'" y="'+(p[1]+(i===2||i===3?-15:16))+'">'+KURZ[i]+'</text><text class="zb-zeit'+(an?' an':'')+'" x="'+p[0]+'" y="'+(p[1]+(i===2||i===3?-24:26))+'">'+hm(t)+'</text>'}).join('');
 const pj=zbPunkt(tj),r=(3+8*frische(l)).toFixed(1);
 svg.innerHTML='<defs><linearGradient id="zbVerlauf"><stop offset="0" stop-color="currentColor" stop-opacity=".25"/><stop offset="1" stop-color="currentColor" stop-opacity=".9"/></linearGradient></defs>'+
  '<path class="zb-bahn" d="'+pfad(60)+'"/><path class="zb-voll" d="'+voll.join('')+'"/>'+marken+(rueck?'<text class="zb-rueck" x="170" y="54">HEUTE · '+GEBETE.filter(i=>heute.ok[i]).length+' VON 5 GEBETET</text>':'')+'<circle id="zbHalo" cx="'+pj[0]+'" cy="'+pj[1]+'" r="'+r+'"/><circle id="zbJetzt" class="'+(l.gebet!==null&&l.ende-l.m<=15?'eile':'')+'" cx="'+pj[0]+'" cy="'+pj[1]+'" r="'+r+'"/>';$('zeitbogen').classList.toggle('rueck',rueck)}

// ---------- Wirkung: je früher im Gebetsfenster, desto größer ----------
const STERNCHEN='<svg class="funke" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12"/><rect x="6" y="6" width="12" height="12" transform="rotate(45 12 12)"/></svg>';
function wirkung(x,y,staerke){const s=Math.max(.12,staerke),box=$('funken'),n=Math.round(5+s*34),weit=50+s*190;
 for(let i=0;i<n;i++){const d=document.createElement('div');d.innerHTML=STERNCHEN;const f=d.firstChild;f.style.left=x+'px';f.style.top=y+'px';box.append(f);
  const w=Math.random()*Math.PI*2,r=weit*(.45+Math.random()*.55),gr=.5+Math.random()*s*1.3;
  f.animate([{transform:'translate(0,0) scale(.2) rotate(0)',opacity:1},{transform:'translate('+Math.cos(w)*r+'px,'+Math.sin(w)*r+'px) scale('+gr+') rotate('+(Math.random()*180)+'deg)',opacity:0}],
   {duration:700+s*900+Math.random()*300,easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish=()=>f.remove()}
 for(let k=0;k<(s>.6?3:s>.3?2:1);k++){const wl=document.createElement('div');wl.className='welle';const g=40;wl.style.cssText+='left:'+(x-g/2)+'px;top:'+(y-g/2)+'px;width:'+g+'px;height:'+g+'px';box.append(wl);
  wl.animate([{transform:'scale(.6)',opacity:.8},{transform:'scale('+(2+s*9)+')',opacity:0}],{duration:900+s*700,delay:k*140,easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish=()=>wl.remove()}
 if(s>.15){const lob=document.createElement('div');lob.className='lob';lob.style.top=(y-62)+'px';lob.textContent=s>.8?'ERSTE ZEIT · ALLAH KABUL ETSIN':s>.5?'FRÜH GEBETET · MASHALLAH':'ALLAH KABUL ETSIN';$('funken').append(lob);
  lob.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none',offset:.2},{opacity:1,offset:.75},{opacity:0}],{duration:2200}).onfinish=()=>lob.remove()}
 haptik();if(s>.4)setTimeout(haptik,120);if(s>.75)setTimeout(haptik,240)}
const mitte=el=>{const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]};

 $('datum').textContent='SAJDA · '+new Date().toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'}).toUpperCase()+' · '+TAG.hijri.toUpperCase();

 info();kacheln();zeitbogen(l)}

 ziel=pos=zeige=letzteStufe=start;karten.forEach(k=>k.p=start+(k.j-start)*1.8+3);zeichnen();setInterval(()=>{if(demoMinute===null)zeichnen()},1000);umschalter('d',zeichnen)});
