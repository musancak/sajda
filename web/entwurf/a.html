<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ufuk · Sajda</title><link rel="stylesheet" href="basis.css">
<style>
[hidden]{display:none!important}
:root{--h:58%;--mono:ui-monospace,'SF Mono',Menlo,monospace}
body{background:#0c1726;color:#fff;font-family:-apple-system,'SF Pro Display',sans-serif}
#himmel{position:fixed;inset:0;background:linear-gradient(180deg,var(--oben,#74b2e0),var(--unten,#e6f0f2) var(--h),var(--unten,#e6f0f2))}
#sterne{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.wolke{position:fixed;border-radius:50%;background:radial-gradient(closest-side,rgb(255 255 255/.85),rgb(255 255 255/0));filter:blur(6px);pointer-events:none;opacity:var(--wolken,.6);transition:opacity 2s}
.wolke.w1{width:260px;height:70px;top:16%;animation:ziehen 340s linear infinite -120s}
.wolke.w2{width:180px;height:50px;top:27%;animation:ziehen 260s linear infinite -200s}
.wolke.w3{width:340px;height:90px;top:9%;animation:ziehen 480s linear infinite -300s;opacity:calc(var(--wolken,.6)*.7)}
.wolke.w4{width:150px;height:40px;top:38%;animation:ziehen 220s linear infinite -60s;opacity:calc(var(--wolken,.6)*.8)}
@keyframes ziehen{from{transform:translateX(-360px)}to{transform:translateX(calc(100vw + 40px))}}
#glut{position:fixed;left:-20%;right:-20%;top:calc(var(--h) - 22%);height:44%;background:radial-gradient(ellipse at var(--gx,50%) 50%,var(--glut,rgb(255 160 90/0)),transparent 62%);pointer-events:none;transition:background 1s}
#bahn{position:fixed;left:0;top:0;width:100%;height:var(--h);overflow:visible;pointer-events:none}
#bahn .weg{fill:none;stroke:#fff;stroke-opacity:.35;stroke-width:1.2;stroke-dasharray:2 7;stroke-linecap:round}
#bahn .gelaufen{fill:none;stroke:#fff;stroke-opacity:.75;stroke-width:1.6;stroke-linecap:round}
#bahn text{fill:#fff;font:600 11px -apple-system,sans-serif;text-anchor:middle;opacity:.85}
#bahn text.z{font:10px var(--mono);opacity:.7}
#bahn circle.m{fill:#fff;opacity:.7}#bahn circle.m.an{opacity:1}
#sonne{position:fixed;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:radial-gradient(circle at 40% 38%,#fffbe8,#ffd66b 55%,#ffb347);box-shadow:0 0 30px 10px rgb(255 214 107/.55),0 0 90px 40px rgb(255 190 90/.25);will-change:transform;transition:background 1.5s,box-shadow 1.5s}
#sonne::before{content:'';position:absolute;inset:-70px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgb(255 230 170/.16) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 70%);mask:radial-gradient(circle,#000 20%,transparent 70%);animation:strahlen 60s linear infinite}
@keyframes strahlen{to{transform:rotate(360deg)}}
#sonne.mond{background:#f4f1e6;box-shadow:inset -12px -4px 0 0 rgb(30 40 70),0 0 26px 6px rgb(220 230 255/.35)}
#sonne.mond::before{display:none}
#skyline{position:fixed;left:0;right:0;top:calc(var(--h) - 92px);z-index:1;height:96px;width:100%;pointer-events:none}
#skyline path,#skyline rect{fill:var(--silhouette,rgb(20 30 50/.55));transition:fill 1.5s}
#skyline .licht{fill:#ffcf7a;opacity:var(--lichter,0);transition:opacity 2s}
#boden{position:fixed;left:0;right:0;top:calc(var(--h) + 3px);bottom:0;background:linear-gradient(180deg,var(--silhouette,rgb(20 30 50/.55)),rgb(10 16 28/.9))}
.kopf{position:fixed;top:max(14px,env(safe-area-inset-top));left:20px;right:150px;z-index:5;text-shadow:0 1px 8px rgb(0 0 0/.25)}
.kopf b{display:block;font-size:15px;font-weight:600}.kopf small{font:10px var(--mono);letter-spacing:.08em;opacity:.8}
#gross{position:fixed;left:0;right:0;top:calc(var(--h) + 14px);text-align:center;z-index:4;text-shadow:0 2px 20px rgb(0 0 0/.18);pointer-events:none}
#gross small{display:block;font:11px var(--mono);letter-spacing:.14em;opacity:.85}
#countdown{font-size:min(24vw,104px);font-weight:200;letter-spacing:-.05em;line-height:1}
.panel{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:6;padding:18px 16px 14px;border-radius:28px;background:rgb(255 255 255/.12);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);box-shadow:inset 0 1px 0 rgb(255 255 255/.25),0 20px 50px -20px rgb(0 0 0/.5);display:flex;flex-direction:column;gap:10px}
.zeile{display:flex;justify-content:space-between;align-items:baseline}
.zeile b{font-size:24px;letter-spacing:-.03em}.zeile span{font:11px var(--mono);letter-spacing:.08em;opacity:.8}
#beten{padding:17px;border-radius:18px;background:#fff;color:#14202e;font-size:17px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 12px 30px -12px rgb(0 0 0/.5)}
#beten[aria-disabled=true]{background:rgb(255 255 255/.18);color:#fff}
.reihe{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.reihe button{padding:13px 14px;border-radius:16px;background:rgb(255 255 255/.14);text-align:left;font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.reihe button span{font:11px var(--mono);opacity:.8;font-weight:400}
.blatt{background:#f4f3f0;color:#14202e}
.kacheln{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kachel{aspect-ratio:1.05;border-radius:18px;background:#e9e7e1;display:flex;flex-direction:column;justify-content:space-between;padding:12px;text-align:left;font-size:14px;font-weight:600}
.kachel small{font-weight:400;opacity:.6;font-size:11px}.kachel.bald{opacity:.5}
.kz-zeile{background:#e9e7e1}.kz-zeile button{background:#14202e}
.funke{position:fixed;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff;pointer-events:none;z-index:7}
</style></head><body>
<div id="himmel"></div><canvas id="sterne"></canvas>
<div class="wolke w3"></div><div class="wolke w1"></div><div class="wolke w2"></div><div class="wolke w4"></div>
<div id="glut"></div>
<svg id="bahn" aria-hidden="true"></svg>
<div id="sonne"></div>
<svg id="skyline" viewBox="0 0 400 96" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
 <path d="M0 96V78h30v-8h22v8h18V66h14v30zM330 96V70h16v-6h20v6h14v-10h20v36z"/>
 <path d="M150 96V62a50 50 0 0 1 100 0v34z"/><path d="M200 12l3 8h-6z"/><rect x="198.6" y="18" width="2.8" height="8"/>
 <path d="M120 96V70a22 22 0 0 1 44 0v26zM236 96V70a22 22 0 0 1 44 0v26z"/>
 <rect x="104" y="20" width="8" height="76"/><path d="M102 22h12l-6-14z"/><rect x="101" y="40" width="14" height="3"/>
 <rect x="288" y="20" width="8" height="76"/><path d="M286 22h12l-6-14z"/><rect x="285" y="40" width="14" height="3"/>
 <path d="M84 96V82h24v14zM292 96V82h24v14z"/>
 <rect class="licht" x="106.5" y="50" width="3" height="5"/><rect class="licht" x="290.5" y="50" width="3" height="5"/><rect class="licht" x="196" y="74" width="8" height="12" rx="4"/><rect class="licht" x="134" y="80" width="5" height="8" rx="2.5"/><rect class="licht" x="261" y="80" width="5" height="8" rx="2.5"/>
</svg>
<div id="boden"></div>
<div class="kopf"><b id="ort"></b><small id="hijri"></small></div>
<div id="gross"><small id="bisText"></small><div id="countdown" class="num"></div></div>
<div class="panel">
 <div class="zeile"><b id="gName"></b><span id="gZeit" class="num"></span></div>
 <button id="beten" class="press"></button>
 <div class="reihe"><button id="kazaPille" class="press">Kaza<span id="kazaText" class="num"></span></button><button id="mehrKnopf" class="press">Mehr<span>6</span></button></div>
</div>
<div class="blatt" id="mehrBlatt"><div class="griff"></div><h2>Mehr</h2><div class="kacheln" id="kacheln"></div></div>
<div class="blatt" id="kazaBlatt"><div class="griff"></div><h2>Kaza</h2><p style="margin:-6px 0 0;opacity:.6;font-size:14px" id="kazaBlattText"></p><div id="kazaBox"></div></div>
<script src="basis.js"></script>
<script>
// Ufuk: der Himmel als Uhr. Sonne/Mond auf der Bahn, Wolken, Sterne, Glut am Horizont, Moschee-Silhouette mit Lichtern.
let W=innerWidth,H=innerHeight,horizont=0;
function masse(){W=innerWidth;H=innerHeight;horizont=H*.58;const c=$('sterne');c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;bahnBauen()}
// Bahn: Halbellipse vom linken zum rechten Horizont
const P=t=>[W*.06+W*.88*t,horizont-8-(horizont*.62)*Math.sin(Math.PI*t)];
function bahnBauen(){if(!TAG)return;const T=TAG.T,svg=$('bahn');svg.setAttribute('viewBox','0 0 '+W+' '+horizont);let d='';for(let i=0;i<=80;i++){const p=P(i/80);d+=(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}
 const tag=T[4]-T[1],tp=i=>(T[i]-T[1])/tag;
 const marke=(i,t,unten)=>{const p=P(t);return'<circle class="m" data-i="'+i+'" cx="'+p[0]+'" cy="'+p[1]+'" r="3.5"/><text x="'+p[0]+'" y="'+(p[1]+(unten?18:-12))+'">'+KURZ[i]+'</text><text class="z" x="'+p[0]+'" y="'+(p[1]+(unten?31:-25))+'">'+hm(T[i])+'</text>'};
 svg.innerHTML='<path class="weg" d="'+d+'"/><path class="gelaufen" id="gelaufen"/>'+marke(1,.035,false)+marke(2,tp(2),false)+marke(3,tp(3),false)+marke(4,.965,false)}
// Sterne: funkeln nachts, ab und zu eine Sternschnuppe
const sterne=Array.from({length:140},()=>({x:Math.random(),y:Math.random()*.6,r:Math.random()*1.2+.3,p:Math.random()*6.3,s:.6+Math.random()*1.6}));let nachtAnteil=0,schnuppe=null;
function sterneMalen(t){const c=$('sterne'),x=c.getContext('2d'),k=devicePixelRatio;x.clearRect(0,0,c.width,c.height);if(nachtAnteil<.02)return;
 for(const s of sterne){const a=nachtAnteil*(.45+.55*Math.sin(t/1000*s.s+s.p));x.globalAlpha=Math.max(0,a);x.fillStyle='#fff';x.beginPath();x.arc(s.x*W*k,s.y*H*k,s.r*k,0,7);x.fill()}
 if(!schnuppe&&Math.random()<.0025*nachtAnteil)schnuppe={x:Math.random()*W*.7+W*.2,y:Math.random()*H*.25,t};
 if(schnuppe){const f=(t-schnuppe.t)/900;if(f>1)schnuppe=null;else{x.globalAlpha=(1-f)*nachtAnteil;x.strokeStyle='#fff';x.lineWidth=1.4*k;x.beginPath();
  const sx=(schnuppe.x-f*160)*k,sy=(schnuppe.y+f*90)*k;x.moveTo(sx,sy);x.lineTo(sx+60*k,sy-34*k);x.stroke()}}x.globalAlpha=1}
function zeichnen(){if(!TAG)return;const l=lage(),T=TAG.T,[o,u]=farben(l.m),r=document.documentElement;r.style.setProperty('--oben',o);r.style.setProperty('--unten',u);
 const tag=T[4]-T[1],istTag=l.m>=T[1]&&l.m<=T[4];let t,p;
 if(istTag){t=(l.m-T[1])/tag;p=P(t)}else{const lang=1440-tag,seit=(l.m-T[4]+1440)%1440;t=seit/lang;const q=P(t);p=[q[0],horizont-8-(horizont-8-q[1])*.75]}
 const so=$('sonne');so.className=istTag?'':'mond';so.style.transform='translate('+p[0]+'px,'+p[1]+'px)';
 if(istTag){let d='';for(let i=0;i<=60;i++){const q=P(i/60*t);d+=(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)}$('gelaufen').setAttribute('d',d)}else $('gelaufen').setAttribute('d','');
 document.querySelectorAll('#bahn circle.m').forEach(c=>c.classList.toggle('an',+c.dataset.i===l.fenster));
 nachtAnteil=istTag?0:Math.min(1,Math.min((l.m-T[4]+1440)%1440,(T[1]-l.m+1440)%1440)/50);
 r.style.setProperty('--wolken',(istTag?.65:.12).toFixed(2));
 const nahAuf=Math.max(0,1-Math.abs(l.m-T[1])/50),nahUnter=Math.max(0,1-Math.abs(l.m-T[4])/50),glut=Math.max(nahAuf,nahUnter);
 r.style.setProperty('--glut','rgb(255 150 80/'+(glut*.6).toFixed(2)+')');r.style.setProperty('--gx',nahAuf>nahUnter?'10%':'90%');
 r.style.setProperty('--lichter',(nachtAnteil*.95+glut*.4).toFixed(2));
 r.style.setProperty('--silhouette',nachtAnteil>.5?'rgb(4 8 16/.85)':'rgb(20 30 50/'+(.45+glut*.25).toFixed(2)+')');
 $('ort').textContent=TAG.stadt+' · '+new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});$('hijri').textContent=TAG.hijri.toUpperCase();
 $('bisText').textContent='BIS '+(l.naechst===1?'SONNENAUFGANG':NAMEN[l.naechst].toUpperCase())+' · '+hm(l.um);rollen($('countdown'),dauer(l.rest));
 const g=l.gebet;$('gName').textContent=g===null?(l.kerahat?'Kurze Pause':'Vormittag'):NAMEN[g];$('gZeit').textContent=g===null?'':'BIS '+hm(l.ende);
 const b=$('beten');if(g===null){b.setAttribute('aria-disabled','true');b.textContent=l.kerahat?'Gerade keine Gebetszeit · ab '+hm(l.kerahat.bis):'Kein Pflichtgebet · Kaza möglich'}
 else{b.removeAttribute('aria-disabled');b.innerHTML=icon('play')+'<span>Jetzt beten</span>'}
 const off=kazaOffen();$('kazaText').textContent=l.kerahat?'AB '+hm(l.kerahat.bis):off?zahl(off)+' OFFEN':'EINRICHTEN';
 $('kazaBlattText').textContent=zahl(kazaErledigt())+' nachgeholt · '+zahl(off)+' offen'}
// Funken aus der Sonne beim Beten
function funken(){const r=$('sonne').getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;for(let i=0;i<26;i++){const f=document.createElement('i');f.className='funke';f.style.left=x+'px';f.style.top=y+'px';document.body.append(f);
 const w=Math.random()*6.28,d=60+Math.random()*120;f.animate([{transform:'none',opacity:1},{transform:'translate('+Math.cos(w)*d+'px,'+Math.sin(w)*d+'px) scale(.3)',opacity:0}],{duration:900+Math.random()*500,easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish=()=>f.remove()}}
const KACHELN=[['drop','Abdest','Waschung'],['drop','Gusül','Ganzkörper'],['book','Lernen','Suren, Tempo'],['beads','Tesbihat','33 · 33 · 33'],['book','Duas','bald',1],['bell','Ezan','Erinnerung · bald',1]];
$('kacheln').replaceChildren(...KACHELN.map(([i,n,s,bald])=>{const b=document.createElement('button');b.className='kachel press'+(bald?' bald':'');b.innerHTML=icon(i)+'<span>'+n+'<br><small>'+s+'</small></span>';b.onclick=haptik;return b}));
const mehr=blatt($('mehrBlatt')),kaza=blatt($('kazaBlatt'));
$('mehrKnopf').onclick=mehr.auf;$('kazaPille').onclick=()=>{kazaListe($('kazaBox'),zeichnen);kaza.auf()};
$('beten').onclick=()=>{if($('beten').getAttribute('aria-disabled'))return haptik();haptik();funken();setTimeout(()=>toast('Gebet startet (Prototyp)',()=>{}),600)};
addEventListener('resize',()=>{masse();zeichnen()});
(function loop(t){sterneMalen(t);requestAnimationFrame(loop)})(0);
zeitenLaden().then(()=>{masse();zeichnen();setInterval(()=>{if(demoMinute===null)zeichnen()},1000);umschalter('a',zeichnen)});
</script></body></html>
