<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Format wählen · Sajda</title><link rel="stylesheet" href="basis.css">
<style>
body{background:linear-gradient(180deg,#ececee,#d9d9dc 70%,#c4c4c8);color:#1d1d1f}
.screen{gap:10px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:.04em;opacity:.6}
h1{margin:4px 0 2px;font-size:32px;letter-spacing:-.035em}
.liste{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0}
.format{flex:1 1 0;max-height:118px;transition:flex .7s var(--spring),max-height .7s var(--spring),background .4s,color .4s;border-radius:14px;text-align:left;background:linear-gradient(160deg,#f7f7f8,#dedee1);box-shadow:0 14px 24px -16px rgb(0 0 0/45%),inset 0 1px 0 #fff;overflow:hidden;padding:0;
 opacity:0;transform:translateY(18px);animation:rein .7s var(--spring) forwards;transition:background .4s,color .4s}
.format:nth-child(2){animation-delay:.05s}.format:nth-child(3){animation-delay:.1s}.format:nth-child(4){animation-delay:.15s}.format:nth-child(5){animation-delay:.2s}
@keyframes rein{to{opacity:1;transform:none}}
.format.bald .seite:first-child{opacity:.5}
.marke-bald{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;font-weight:600;letter-spacing:.04em;background:rgb(0 0 0/8%);border-radius:999px;padding:2px 7px;margin-left:auto;align-self:center;white-space:nowrap}
.format[aria-pressed=true]{background:linear-gradient(160deg,#2c2c30,#18181b);color:#f5f5f7}
.schiene{display:flex;width:200%;height:100%;transition:transform .75s var(--spring)}
.format.zeigt .schiene{transform:translateX(-50%)}
.seite{width:50%;height:100%;display:flex;align-items:center;gap:14px;padding:12px 14px}
.seite>svg{width:44px;height:44px;flex:none;fill:none;stroke:currentColor;stroke-width:1.3;opacity:.85}
.seite span{flex:1;min-width:0}
.seite b{font-size:20px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px}
.seite b i{font-style:normal;font-size:16px;font-weight:400;opacity:.6}
.seite em{display:block;font-style:normal;font-size:13px;opacity:.65;margin-top:2px;line-height:1.35}
.weiter{padding:16px;border-radius:14px;background:#1f4d3f;color:#fff;font-weight:650;font-size:17px}
/* Mini-Handy mit kleinem Film */
.handy{position:relative;width:50px;height:min(92px,calc(100% - 4px));flex:none;border-radius:11px;overflow:hidden;box-shadow:0 0 0 2.5px #0d0d0f,0 8px 16px -6px rgb(0 0 0/50%);background:#f6f3ea}
.handy *{position:absolute;box-sizing:border-box}
.laeuft .handy *{animation-play-state:running!important}
.handy *{animation-play-state:paused!important;animation-fill-mode:both!important}
.film{margin-left:2px}
.film small{display:block;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;opacity:.6;letter-spacing:.04em}
.balken{position:absolute;left:0;bottom:0;height:2px;background:currentColor;opacity:.5;width:0}
.laeuft .balken{animation:fortschritt 3.6s linear forwards}
@keyframes fortschritt{to{width:100%}}
/* Fitra */
.fi .z{width:12px;height:10px;border-radius:2px;background:#fff;border:.5px solid #cbd3c7;animation:auf .4s var(--spring)}
.fi .z.an{background:#204f40}
.fi .r{left:5px;right:5px;height:9px;border-radius:3px;background:#fffcf5;border:.5px solid #cbd3c7;animation:auf .5s var(--spring)}
@keyframes auf{from{opacity:0;transform:translateY(5px)}}
.fi .lese{inset:0;background:#f6f3ea;animation:lesen 3.6s cubic-bezier(.2,.8,.2,1)}
@keyframes lesen{0%,58%{transform:translateX(100%)}66%,100%{transform:none}}
.fi .lese i{left:5px;height:6px;border-radius:2px;background:#183c33}
.fi .lese i:nth-child(1){top:22px;width:38px}.fi .lese i:nth-child(2){top:32px;width:30px}.fi .lese i:nth-child(3){top:42px;width:34px;opacity:.35}
/* Ufuk */
.uf{background:linear-gradient(180deg,#1d2b4f,#5b6fa6 25%,#8cc3ea 45%,#e6f0f2 60%,#f4b98a 78%,#232c52);background-size:100% 500%}
.laeuft .uf{animation:himmel 3.6s ease-in-out both}
@keyframes himmel{from{background-position:0 0}to{background-position:0 100%}}
.uf .s{width:8px;height:8px;border-radius:50%;background:#ffc94d;box-shadow:0 0 6px #ffd27a;animation:bogen 3.6s ease-in-out}
@keyframes bogen{0%{left:4px;top:34px}25%{left:12px;top:16px}50%{left:21px;top:10px}75%{left:30px;top:16px}100%{left:38px;top:34px}}
.uf .zahl{left:10px;right:10px;top:50px;height:7px;border-radius:3px;background:rgb(255 255 255/70%)}
.uf .k{left:6px;right:6px;bottom:8px;height:11px;border-radius:5px;background:rgb(255 255 255/35%)}
/* Lawh */
.la{background:#f6f3ea}
.la .t{border-radius:4px;background:#fffdf8;box-shadow:0 1px 3px rgb(0 0 0/15%)}
.la .t.g{background:#2b3a5c;animation:wachsen 3.6s var(--spring)}
@keyframes wachsen{0%,25%{left:5px;top:8px;width:40px;height:22px;border-radius:4px}45%,75%{left:0;top:0;width:50px;height:92px;border-radius:0}100%{left:5px;top:8px;width:40px;height:22px;border-radius:4px}}
/* Waqt */
.wa{background:#f3f3f1}
.wa .fl{left:0;right:0;bottom:0;background:#e0e0dd;border-top:.5px solid rgb(0 0 0/15%);animation:flut 3.6s ease-in-out}
@keyframes flut{from{height:22%}to{height:62%}}
.wa .zz{left:9px;right:9px;top:34px;height:14px;border-radius:2px;border:1.2px solid #161617;border-left:0;border-right:0;animation:tick 1.2s steps(1) infinite}
@keyframes tick{50%{opacity:.6}}
.wa .wo{left:12px;right:12px;top:53px;height:3px;border-radius:2px;background:#161617;opacity:.35}
.wa .rg{left:13px;top:60px;width:24px;height:24px;border-radius:50%;border:1.5px solid #1f4d3f;opacity:0;animation:halten 3.6s}
@keyframes halten{0%,52%{opacity:0;transform:scale(.4)}60%,78%{opacity:1;transform:none}82%,100%{opacity:0}}
.wa .bl{inset:0;background:#1f4d3f;opacity:0;animation:blende 3.6s}
@keyframes blende{0%,78%{opacity:0}84%,92%{opacity:1}100%{opacity:0}}
/* Falak */
.fa{background:linear-gradient(180deg,#ececee 0 60%,#a9a9ad 60.5%,#6d6d72)}
.fa .bahn{left:-22px;top:20px;width:94px;height:94px;border-radius:50%;border:.8px solid rgb(0 0 0/22%);clip-path:inset(0 0 72% 0)}
.fa .pe{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#b9b9bd;box-shadow:0 2px 3px rgb(0 0 0/30%);animation:3.6s cubic-bezier(.3,1.3,.4,1) both}
.fa .pe.g{background:#1f4d3f}
.fa .r{background:transparent;box-shadow:inset 0 0 0 1px #6d6d72}
@keyframes p1{0%,35%{left:7px;top:31px}65%,100%{left:2px;top:38px;opacity:0}}
@keyframes p2{0%,35%{left:15px;top:24px}65%,100%{left:7px;top:31px}}
@keyframes p3{0%,35%{left:25px;top:21px;transform:scale(1.9);background:#1f4d3f}65%,100%{left:15px;top:24px;transform:none;background:#b9b9bd}}
@keyframes p4{0%,35%{left:35px;top:24px;background:transparent}65%,100%{left:25px;top:21px;transform:scale(1.9);background:#1f4d3f;box-shadow:0 2px 4px rgb(0 0 0/35%)}}
@keyframes p5{0%,35%{left:43px;top:31px}65%,100%{left:35px;top:24px}}
.fa .p{left:20px;top:42px;width:10px;height:10px;border-radius:50%;background:#1f4d3f;box-shadow:0 0 0 2px rgb(255 255 255/75%);animation:knopf 3.6s}
@keyframes knopf{0%,40%{transform:none}50%{transform:scale(.6)}62%{transform:scale(1.2)}72%,100%{transform:none}}
.fa .t1{left:9px;right:9px;top:58px;height:4px;border-radius:2px;background:#1d1d1f;opacity:.75}
.fa .t2{left:15px;right:15px;top:65px;height:2px;border-radius:2px;background:#1d1d1f;opacity:.3}
.fa .sg{left:6px;right:6px;top:70px;height:6px;border-radius:2px;background:rgb(0 0 0/10%)}
.fa .sg::after{content:'';position:absolute;right:1px;top:1px;bottom:1px;width:48%;border-radius:2px;background:#fff}
.fa .k{bottom:4px;height:9px;border-radius:2px;background:rgb(255 255 255/25%)}
/* Intro: Frage nach dem Stand, dann Empfehlung */
#intro{z-index:5;gap:12px;background:inherit;transition:opacity .5s var(--ease),transform .6s var(--spring)}
#intro.weg{opacity:0;transform:translateY(-24px);pointer-events:none}
#intro h1{font-size:34px;line-height:1.08;margin-top:auto}
#intro p{margin:0 0 10px;font-size:15px;line-height:1.4;opacity:.7}
.antwort{display:block;text-align:left;padding:18px 18px 16px;border-radius:16px;background:linear-gradient(160deg,#f7f7f8,#dedee1);box-shadow:0 14px 24px -16px rgb(0 0 0/45%),inset 0 1px 0 #fff;opacity:0;transform:translateY(18px);animation:rein .7s var(--spring) forwards}
.antwort+.antwort{animation-delay:.08s}
.antwort b{display:block;font-size:20px;letter-spacing:-.02em}
.antwort em{display:block;font-style:normal;font-size:13px;opacity:.65;margin-top:3px;line-height:1.35}
.antwort small{display:block;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:.04em;opacity:.55;margin-top:10px}
#intro .leise{margin:6px auto 0;font-size:13px;opacity:.55;padding:8px}
.empfohlen{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;font-weight:600;letter-spacing:.04em;background:#1f4d3f;color:#fff;border-radius:999px;padding:2px 7px;margin-left:auto;align-self:center;white-space:nowrap}
#grund,.seite b .marke-bald,.seite b .empfohlen{flex:none}
#grund{font-size:14px;line-height:1.4;margin:0 0 4px;opacity:.8}
</style></head><body>
<div class="screen" id="intro">
 <span class="mono">SAJDA · WILLKOMMEN</span>
 <h1>Wie gut kennst du das Gebet schon?</h1>
 <p>Wir empfehlen dir das passende Format. Du kannst es danach frei ändern.</p>
 <button class="antwort press" data-format="../index"><b>Ich möchte beten lernen</b><em>Jede Haltung, jede Sure, Schritt für Schritt geführt.</em><small>EMPFEHLUNG: FITRA</small></button>
 <button class="antwort press" data-format="d"><b>Ich kann es schon</b><em>Gebetszeiten und Überblick, schnell und ruhig.</em><small>EMPFEHLUNG: FALAK</small></button>
 <button class="leise" data-format="">Selbst aussuchen</button>
</div>
<div class="screen">
 <span class="mono">SAJDA · WILLKOMMEN</span>
 <h1>Wähle dein Format</h1>
 <span class="mono" style="opacity:.55;margin-bottom:4px">Später jederzeit in den Einstellungen änderbar</span>
 <p id="grund" hidden></p>
 <div class="liste" id="liste"></div>
 <button class="weiter press" id="weiter">Weiter</button>
</div>
<script src="basis.js"></script>
<script>
document.querySelector('.wahl')?.remove();document.querySelector('.regler')?.remove();
const ARAB={Fitra:'فطرة',Ufuk:'أفق',Lawh:'لوح',Waqt:'وقت',Falak:'فلك'};
const BILD={Fitra:'<rect x="10" y="8" width="28" height="32" rx="4"/><path d="M16 17h16M16 24h16M16 31h10"/>',Ufuk:'<path d="M4 34h40"/><path d="M8 34a16 16 0 0 1 32 0" stroke-dasharray="2 3"/><circle cx="31" cy="21" r="3.5"/>',
 Lawh:'<rect x="6" y="6" width="36" height="16" rx="3"/><rect x="6" y="26" width="16" height="16" rx="3"/><rect x="26" y="26" width="16" height="16" rx="3"/>',Waqt:'<circle cx="24" cy="24" r="17"/><path d="M24 13v11l7 4"/>',
 Falak:'<rect x="17" y="10" width="14" height="22" rx="2"/><rect x="4" y="15" width="11" height="17" rx="2" transform="rotate(-14 9 23)"/><rect x="35" y="16" width="8" height="15" rx="2"/><path d="M4 40q20-8 40 0"/>'};
// kleine Filme: was man in dem Format ungefähr sieht
const z=(l,t,an,d)=>'<i class="z'+(an?' an':'')+'" style="left:'+l+'px;top:'+t+'px;animation-delay:'+d+'s"></i>';
const FILM={
 Fitra:['fi',z(5,7,0,.1)+z(19,7,0,.2)+z(33,7,0,.3)+z(5,20,0,.4)+z(19,20,0,.5)+z(33,20,1,.6)+[36,48,60,72].map((t,i)=>'<i class="r" style="top:'+t+'px;animation-delay:'+(1+i*.35)+'s"></i>').join(''),['Gebetszeiten auf einen Blick','Darunter alle Gebete zur Auswahl','Dann Schritt für Schritt geführt']],
 Ufuk:['uf','<i class="s"></i><i class="zahl"></i><i class="k"></i>',['Die Sonne wandert über den Bogen','Der Himmel färbt sich mit dem Tag','Groß: wie lange noch']],
 Lawh:['la','<i class="t" style="left:5px;top:34px;width:40px;height:16px"></i><i class="t" style="left:5px;top:54px;width:18px;height:16px"></i><i class="t" style="left:27px;top:54px;width:18px;height:16px"></i><i class="t" style="left:5px;top:74px;width:40px;height:12px"></i><i class="t g"></i>',['Alles als Karten','Eine Karte wächst zur ganzen Seite','Wischen, und sie schrumpft zurück']],
 Waqt:['wa','<i class="fl"></i><i class="zz"></i><i class="wo"></i><i class="rg"></i><i class="bl"></i>',['Nur die Zeit, ganz groß','Die Fläche steigt mit der Gebetszeit','Halten, und das Gebet beginnt']],
 Falak:['fa','<i class="bahn"></i><i class="pe" style="animation-name:p1"></i><i class="pe" style="animation-name:p2"></i><i class="pe g" style="animation-name:p3"></i><i class="pe r" style="animation-name:p4"></i><i class="pe r" style="animation-name:p5"></i><i class="p"></i><i class="t1"></i><i class="t2"></i><i class="sg"></i><i class="k" style="left:4px;width:20px"></i><i class="k" style="left:26px;width:9px"></i><i class="k" style="left:37px;width:9px"></i>',['Die Gebete wie Perlen auf ihrer Bahn','Wischen dreht den Tag weiter','Spätere Gebete sind noch verschlossen']]};
// nur Fitra und Falak sind frei, die anderen kommen bald
const BALD=new Set(['a','b','c']);
let wahl='d',gespeichert=null;try{gespeichert=localStorage.getItem('sajda-format')}catch{}if(gespeichert&&!BALD.has(gespeichert))wahl=gespeichert;
let empfohlen=null;
const GRUND={'../index':'Du möchtest beten lernen: Fitra führt dich Schritt für Schritt durch jedes Gebet. Aufbau und Konzept machen den Einstieg sehr einfach.',
 d:'Du kannst es schon: Falak zeigt dir den Tag auf einen Blick, die Gebete wie Perlen auf ihrer Bahn.'};
const uhren=new Map();
function zeichnen(){$('liste').replaceChildren(...FORMATE.map(([datei,name,text])=>{const b=document.createElement('button');b.className='format press'+(BALD.has(datei)?' bald':'');b.setAttribute('aria-pressed',datei===wahl);
 const [cls,inhalt,zeilen]=FILM[name];
 b.innerHTML='<div class="schiene"><div class="seite"><svg viewBox="0 0 48 48" aria-hidden="true">'+BILD[name]+'</svg><span><b>'+name+'<i>'+ARAB[name]+'</i>'+(BALD.has(datei)?'<span class="marke-bald">BALD VERFÜGBAR</span>':datei===empfohlen?'<span class="empfohlen">EMPFOHLEN</span>':'')+'</b><em>'+text+'</em></span></div>'+
  '<div class="seite" style="position:relative"><div class="handy '+cls+'">'+inhalt+'</div><span class="film"><b>'+name+'<i>'+ARAB[name]+'</i></b><small>VORSCHAU</small><em>'+zeilen[0]+'</em></span><i class="balken"></i></div></div>';
 b.onclick=()=>{if(BALD.has(datei)){haptik();vorspielen(b);return}wahl=datei;try{localStorage.setItem('sajda-format',datei)}catch{}haptik();
  document.querySelectorAll('.format').forEach((x,i)=>x.setAttribute('aria-pressed',FORMATE[i][0]===wahl));vorspielen(b)};return b}))}
// Film: Kachel gleitet zur Vorschau, spielt einmal ab, gleitet zurück
function vorspielen(b){for(const [x,u] of uhren){clearTimeout(u);x.classList.remove('zeigt','laeuft')}uhren.clear();
 const film=b.querySelector('.handy'),neu=film.cloneNode(true);film.replaceWith(neu);const bal=b.querySelector('.balken'),nb=bal.cloneNode();bal.replaceWith(nb);
 b.classList.add('zeigt');uhren.set(b,setTimeout(()=>{b.classList.add('laeuft');uhren.set(b,setTimeout(()=>{b.classList.remove('zeigt');setTimeout(()=>b.classList.remove('laeuft'),700);uhren.delete(b)},3800))},450))}
// Intro nur beim ersten Mal (aus den Einstellungen kommt man mit gespeichertem Format direkt zur Liste)
const intro=$('intro');if(gespeichert)intro.remove();else intro.querySelectorAll('[data-format]').forEach(k=>k.onclick=()=>{haptik();
 if(k.dataset.format){wahl=empfohlen=k.dataset.format;$('grund').textContent=GRUND[wahl];$('grund').hidden=false}
 zeichnen();intro.classList.add('weg');setTimeout(()=>intro.remove(),700);
 if(empfohlen){const i=FORMATE.findIndex(f=>f[0]===empfohlen);setTimeout(()=>vorspielen(document.querySelectorAll('.format')[i]),650)}});
zeichnen();$('weiter').onclick=()=>{haptik();location.href=wahl+'.html'};
</script></body></html>
